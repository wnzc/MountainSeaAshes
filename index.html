<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>山海余烬 · 镜水涧 Demo</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

    <div id="app">
      <div id="frame">
        <canvas id="game" width="1080" height="1920"></canvas>

        <!-- 顶部 HUD -->
        <div id="hud">
          <div class="hud-pill"><span class="ico">☰</span><span id="hud-wave">1/8</span></div>
          <div class="hud-pill"><span class="ico">❤</span><span id="hud-hp">20</span></div>
          <div class="hud-pill"><span class="ico">◉</span><span id="hud-gold">320</span></div>
          <div class="hud-spacer"></div>
          <button class="hud-btn" id="btn-speed" title="倍速">×1</button>
          <button class="hud-btn" id="btn-sound" title="音效">♪</button>
          <button class="hud-btn" id="btn-pause" title="暂停">Ⅱ</button>
        </div>

        <!-- Boss 血条 -->
        <div id="boss-bar" class="hidden">
          <div class="label">蚀山君</div>
          <div class="track"><div id="boss-fill"></div></div>
        </div>

        <!-- 连锁提示 -->
        <div id="chain-banner" class="hidden"></div>

        <!-- 塔位菜单 -->
        <div id="slot-panel" class="hidden"></div>

        <!-- 底部灵兽卡 -->
        <div id="card-bar"></div>

        <!-- Toast -->
        <div id="toast" class="hidden"></div>

        <!-- 开始页 -->
        <div id="start-panel" class="overlay">
          <div class="panel">
            <h1>山海余烬<span class="en">SHANHAI EMBERS</span></h1>
            <p class="tagline">淡墨山海 · 绚烂五灵</p>
            <p class="sub">镜水涧 Demo<br />放置灵兽，构筑元素连锁，守住灵种。</p>
            <button class="btn btn-primary" id="btn-start">进入山河</button>
          </div>
        </div>

        <!-- 暂停 -->
        <div id="pause-panel" class="overlay hidden">
          <div class="panel">
            <h1 style="font-size: 28px">暂停</h1>
            <p class="sub">灵息暂歇</p>
            <button class="btn btn-primary" id="btn-resume">继续</button>
            <button class="btn btn-secondary" id="btn-restart-pause">重新开始</button>
          </div>
        </div>

        <!-- 结算 -->
        <div id="result-panel" class="overlay hidden">
          <div class="panel">
            <h1 id="result-title">山河复色</h1>
            <p id="result-stats"></p>
            <button class="btn btn-primary" id="btn-retry">再来一局</button>
            <button class="btn btn-secondary" id="btn-home">回到封面</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { Game } from './js/engine.js';
      import { initUI, bindInput } from './js/main.js';

      const canvas = document.getElementById('game');
      const game = new Game(canvas);
      initUI(game);
      bindInput(game, canvas);
      game.startLoop();
      window.__game = game; // 便于调试 / 自动化验收
    </script>
  </body>
</html>
